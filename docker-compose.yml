name: myra-local
services:
  ollama:
    image: ollama/ollama:latest
    container_name: myra-local-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    container_name: myra-local-searxng
    profiles: ["search"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
      SEARXNG_SECRET: ${MYRA_SEARXNG_SECRET:?Set a local secret in .env}
    volumes:
      - searxng_data:/var/cache/searxng

volumes:
  ollama_data:
  searxng_data:
