[package]
name = "myra-widget"
version = "0.26.3"
description = "MYRA widget"
authors = ["BielDominic"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "myra_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.5", features = [] }
tauri-plugin-log = "2.2"
url = "2.5"

[profile.dev]
opt-level = 1

[profile.dev.build-override]
opt-level = 2
