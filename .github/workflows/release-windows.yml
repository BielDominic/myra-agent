name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Prepare clean backend payload
        shell: pwsh
        run: python scripts/prepare_installer.py
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y
      - name: Install Tauri CLI
        shell: pwsh
        run: npm install --global @tauri-apps/cli@2.12.1
      - name: Build MYRA installer
        shell: pwsh
        run: |
          $tauri = Join-Path (npm prefix -g) "tauri.cmd"
          & $tauri build --bundles nsis --config src-tauri/tauri.windows.conf.json
      - name: Package backend setup and checksums
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $versionLine = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            if (-not $versionLine) { throw "Could not read MYRA version from Cargo.toml." }
            $tag = "v" + $versionLine.Matches[0].Groups[1].Value
          }
          $releaseDir = "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          # Core setup and optional browser/vision payload are separate assets to stay below GitHub's 2 GB asset limit.
          $core = "MYRA_${tag}_Backend_Setup"
          New-Item -ItemType Directory -Force -Path $core | Out-Null
          Copy-Item installer/backend,installer/wheelhouse,installer/runtime,setup_backend.ps1,start_myra.ps1,INSTALL_WINDOWS.md $core -Recurse -Force
          $coreZip = Join-Path $releaseDir "$core.zip"
          Compress-Archive -Path (Join-Path $core "*") -DestinationPath $coreZip -CompressionLevel Optimal -Force

          $optional = "MYRA_${tag}_Optional_Offline_Engines"
          New-Item -ItemType Directory -Force -Path $optional | Out-Null
          Copy-Item installer/wheelhouse-vision,installer/playwright-browsers $optional -Recurse -Force
          $optionalZip = Join-Path $releaseDir "$optional.zip"
          Compress-Archive -Path (Join-Path $optional "*") -DestinationPath $optionalZip -CompressionLevel Optimal -Force

          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          @($installer, (Get-Item $coreZip), (Get-Item $optionalZip)) | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content (Join-Path $releaseDir "SHA256SUMS.txt")
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MYRA ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            release/*.zip
            release/SHA256SUMS.txt
