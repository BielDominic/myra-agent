name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare clean backend payload
        shell: pwsh
        run: python scripts/prepare_installer.py
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y
      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version 2.12.1 --locked
      - name: Build MYRA installer
        shell: pwsh
        run: cargo tauri build --bundles nsis
      - name: Package backend setup and checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $package = "MYRA_$tag_Backend_Setup"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item installer/backend,setup_backend.ps1,start_myra.ps1,INSTALL_WINDOWS.md $package -Recurse -Force
          Compress-Archive -Path $package -DestinationPath "$package.zip" -Force
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          @($installer, (Get-Item "$package.zip")) | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content SHA256SUMS.txt
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            MYRA_*_Backend_Setup.zip
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MYRA ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            MYRA_*_Backend_Setup.zip
            SHA256SUMS.txt
