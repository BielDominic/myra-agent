name: MYRA test suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/fase26-ciclo-autonomo]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run unit and contract tests (no real services)
        env:
          MYRA_TASK_DB: ${{ runner.temp }}/myra-ci-tasks.sqlite3
        run: python -m unittest discover -s tests -t . -v
