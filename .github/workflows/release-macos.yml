name: macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/fase26-vision-fixes"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.1
      - name: Build macOS app and DMG
        run: |
          tauri build --target ${{ matrix.target }} --bundles dmg --config src-tauri/tauri.macos.conf.json
      - name: Rename and checksum DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find . -type f -path '*/bundle/dmg/*.dmg' -print -quit)
          test -n "$dmg"
          safe_ref="${GITHUB_REF_NAME//\//-}"
          cp "$dmg" "MYRA_${safe_ref}_${{ matrix.arch }}.dmg"
          shasum -a 256 "MYRA_${safe_ref}_${{ matrix.arch }}.dmg" > "MYRA_${safe_ref}_${{ matrix.arch }}.sha256"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-macOS-${{ matrix.arch }}
          path: |
            MYRA_*.dmg
            MYRA_*.sha256
          if-no-files-found: error
      - name: Publish macOS release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MYRA ${{ github.ref_name }}
          files: |
            MYRA_*.dmg
            MYRA_*.sha256
