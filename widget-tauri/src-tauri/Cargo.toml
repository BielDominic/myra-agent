[package]
name = "myra-widget"
version = "0.1.0"
description = "MYRA widget"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
winreg = "0.55"
tauri-plugin-notification = "2"

[profile.release]
lto = true
strip = true
