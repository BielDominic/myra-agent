server {
    listen 80;
    server_name localhost;

    # Favicons customizados do MYRA
    location = /static/favicon.png { alias /usr/share/nginx/html/favicon.png; }
    location = /static/favicon.ico { alias /usr/share/nginx/html/favicon.ico; }
    location = /static/favicon.svg { alias /usr/share/nginx/html/favicon.svg; }
    location = /static/favicon-96x96.png { alias /usr/share/nginx/html/favicon-96x96.png; }
    location = /static/apple-touch-icon.png { alias /usr/share/nginx/html/apple-touch-icon.png; }
    location = /static/logo.png { alias /usr/share/nginx/html/logo.png; }

    location / {
        proxy_pass http://open-webui-custom:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        # Suporte a WebSocket (obrigatorio para Open WebUI 0.5.0+)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Desabilita buffer para respostas em streaming (SSE)
        proxy_buffering off;
        proxy_cache off;

        # Timeouts longos para conexoes WebSocket e respostas do LLM
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Injeta script que corrige o titulo e a sidebar
        sub_filter_once off;
        sub_filter '<title>Open WebUI</title>' '<title>MYRA</title>';
        sub_filter '</head>' '<script>(function(){function fix(){var t=document.querySelector("title");if(t&&t.textContent!=="MYRA"){t.textContent="MYRA";}document.querySelectorAll("*").forEach(function(el){if(el.children.length===0&&el.textContent&&el.textContent.indexOf("(Open WebUI)")!==-1){el.textContent=el.textContent.replace(/\s*\(Open WebUI\)/g,"");}});}new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true,characterData:true});setInterval(fix,200);})();</script></head>';
    }
}